name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore signing key
        env:
          K: ${{ secrets.KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, sys
          k = ''.join(os.environ.get('K', '').split())
          if not k:
              sys.exit('KEYSTORE_B64 secret is empty or missing - check its name in Settings > Secrets')
          k += '=' * (-len(k) % 4)
          data = base64.b64decode(k)
          open('app/release.jks', 'wb').write(data)
          print('Signing key restored:', len(data), 'bytes (should be 2720)')
          PY
      - run: gradle assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectionMapper-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
