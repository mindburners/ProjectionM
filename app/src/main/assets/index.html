<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"></head><body>
<title>Pocket Projection Mapper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Single-look dark stage: black for the projector, cyan handles, amber for the selected shape */
:root{--bg:#000;--panel:#14161c;--line:#2a2e38;--fg:#e8eaf0;--dim:#8a90a0;--accent:#2fd3e0;--sel:#ffb703;color-scheme:dark;
--ui:system-ui,-apple-system,"Roboto",sans-serif}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;overflow:hidden}
.layer img,.layer canvas,.layer video{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill}
svg#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg#ov .h{pointer-events:all;cursor:grab}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:6px;
padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
background:color-mix(in srgb,var(--panel) 94%,transparent);border-top:1px solid var(--line);z-index:5}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:2px}
button,label.btn{font:600 15px var(--ui);color:var(--fg);background:#1f232c;border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:44px;min-width:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--accent)}
button.go{background:var(--accent);color:#001014;border-color:var(--accent)}
button.on{border-color:var(--accent);color:var(--accent)}
input[type=file]{display:none}
input[type=range]{width:90px;accent-color:var(--accent)}
.op{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
#hint{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:13px;color:var(--fg);background:#000c;border:1px solid var(--line);padding:8px 12px;border-radius:6px;z-index:5;text-align:center;max-width:90%}
#hide{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:6;min-height:36px;font-size:13px}
body.proj #bar,body.proj #hint,body.proj #ov,body.proj #hide{display:none}
body.min #bar{display:none}
body.cool #bar{pointer-events:none}
#nudge .lbl{min-width:58px;text-align:right}
#nudge button{min-width:52px;font-size:18px}
.layer.free>*:not(.fcv){visibility:hidden}
.layer .fcv{position:absolute;left:0;top:0}
body.locked #ov,body.locked #nudge{display:none!important}
body.locked .edit{opacity:.35;pointer-events:none}
#exit{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));z-index:9;min-height:48px;padding:10px 18px;background:#1f232c;border-color:var(--accent);color:var(--accent)}
</style>

<div id="stage"><svg id="ov"></svg></div>
<div id="hint">Add a shape, drag its cyan points onto your surface, then load an image. Tap a corner and use the arrows for fine adjustment; press Lock when it's lined up. While projecting, tap the screen once and press Exit projection to get back.</div>
<button id="hide">Hide bar</button>
<button id="exit" hidden>Exit projection</button>
<div id="bar">
  <div class="row">
    <span class="lbl">Add</span>
    <button class="edit" data-add="quad" title="Square / 4-corner"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/></svg>Square</button>
    <button class="edit" data-add="circle" title="Circle"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>Circle</button>
    <button class="edit" data-add="tri" title="Triangle"><svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/></svg>Triangle</button>
    <button class="edit" data-add="free" title="Freeform"><svg viewBox="0 0 24 24"><path d="M4 8l6-4 9 3 1 8-7 5-9-3z"/></svg>Free</button>
  </div>
  <div class="row" id="nudge" hidden>
    <span class="lbl" id="nlbl">Corner</span>
    <button data-n="-1,0" aria-label="Nudge left">&larr;</button>
    <button data-n="0,-1" aria-label="Nudge up">&uarr;</button>
    <button data-n="0,1" aria-label="Nudge down">&darr;</button>
    <button data-n="1,0" aria-label="Nudge right">&rarr;</button>
  </div>
  <div class="row">
    <label class="btn edit" for="file">Image</label><input id="file" type="file" accept="image/*,video/*">
    <span id="ptbtns" class="edit" hidden><button id="addpt">+ Point</button> <button id="delpt">− Point</button></span>
    <button id="grid">Grid</button>
    <span class="op edit">Fade <input id="opa" type="range" min="0" max="1" step="0.05" value="1"></span>
    <button id="up" class="edit" title="Bring forward">Front</button>
    <button id="del" class="edit">Delete</button>
    <button id="clr" class="edit">Clear all</button>
    <button id="lock">Lock</button>
    <button id="go" class="go">Project</button>
  </div>
</div>

<script>
const stage=document.getElementById('stage'),ov=document.getElementById('ov');
let layers=[],sel=null,selPt=-1,showGrid=false,nextId=1,locked=false;
const W=()=>innerWidth,H=()=>innerHeight;

/* ---------- textures ---------- */
function sampleCanvas(type){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){g.fillStyle=(x+y)%2?'#2fd3e0':'#101820';g.fillRect(x*64,y*64,64,64)}
 g.fillStyle='#ffb703';g.font='bold 52px sans-serif';g.textAlign='center';g.fillText('IMAGE',256,type==='tri'?380:275);return c}
function gridCanvas(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
 g.strokeStyle='#fff';g.lineWidth=3;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*64,0);g.lineTo(i*64,512);g.stroke();g.beginPath();g.moveTo(0,i*64);g.lineTo(512,i*64);g.stroke()}
 g.beginPath();g.arc(256,256,180,0,7);g.stroke();return c}

/* ---------- shapes ---------- */
function defaultPts(type){
  const w=W(),h=H(),s=Math.min(w,h)*.28,o=(layers.length%4)*30,cx=w/2-45+o,cy=h/2-70+o;
  if(type==='tri')return[[cx,cy-s],[cx+s,cy+s*.8],[cx-s,cy+s*.8]];
  if(type==='free'){const p=[];for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/2,r=s*(i%2?.8:1);p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
  return[[cx-s,cy-s],[cx+s,cy-s],[cx+s,cy+s],[cx-s,cy+s]];
}
function srcFromPts(pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),y0=Math.min(...ys),
  bw=Math.max(...xs)-x0||1,bh=Math.max(...ys)-y0||1;return pts.map(p=>[(p[0]-x0)/bw,(p[1]-y0)/bh])}
function addLayer(type,pts,opacity,id,src){
  const el=document.createElement('div');el.className='layer';
  const media=sampleCanvas(type);el.appendChild(media);stage.insertBefore(el,ov);
  const L={id:id||nextId++,type,el,media,w:512,h:512,opacity:opacity??1,pts:pts||defaultPts(type)};
  if(type==='free'){el.classList.add('free');L.cv=document.createElement('canvas');L.cv.className='fcv';el.appendChild(L.cv);
    L.src=(src&&src.length===L.pts.length)?src:srcFromPts(L.pts)}
  nextId=Math.max(nextId,L.id+1);
  layers.push(L);sel=L;selPt=-1;return L;
}
function setMediaSize(L,w,h){const k=Math.min(1,1024/Math.max(w,h));L.w=Math.round(w*k);L.h=Math.round(h*k)}

/* ---------- maths ---------- */
function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]]}
function mul(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s}return c}
function mv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]}
function basis(p){const m=[p[0][0],p[1][0],p[2][0],p[0][1],p[1][1],p[2][1],1,1,1];const v=mv(adj(m),[p[3][0],p[3][1],1]);
 return mul(m,[v[0],0,0,0,v[1],0,0,0,v[2]])}
function homography(src,dst){const t=mul(basis(dst),adj(basis(src)));for(let i=0;i<9;i++)t[i]/=t[8];
 return`matrix3d(${t[0]},${t[3]},0,${t[6]},${t[1]},${t[4]},0,${t[7]},0,0,1,0,${t[2]},${t[5]},0,${t[8]})`}
function affine(s,d){const m=affNum(s,d);return`matrix(${m.join(',')})`}
function affNum(s,d){ // 3 src -> 3 dst, returns [a,b,c,d,e,f] or null
  const [x0,y0]=s[0],[x1,y1]=s[1],[x2,y2]=s[2],det=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);
  if(Math.abs(det)<1e-9)return null;
  const a=((d[1][0]-d[0][0])*(y2-y0)-(d[2][0]-d[0][0])*(y1-y0))/det,c=((d[2][0]-d[0][0])*(x1-x0)-(d[1][0]-d[0][0])*(x2-x0))/det;
  const b=((d[1][1]-d[0][1])*(y2-y0)-(d[2][1]-d[0][1])*(y1-y0))/det,dd=((d[2][1]-d[0][1])*(x1-x0)-(d[1][1]-d[0][1])*(x2-x0))/det;
  return[a,b,c,dd,d[0][0]-a*x0-c*y0,d[0][1]-b*x0-dd*y0]}

/* freeform: warp the image through a fan of triangles around the centre */
let gridImg=null;
function drawFree(L){
  const cv=L.cv,dpr=devicePixelRatio||1,w=W(),h=H();
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px'}
  const g=cv.getContext('2d');g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
  const n=L.pts.length,mw=L.w,mh=L.h;
  const D=L.pts,S=L.src.map(p=>[p[0]*mw,p[1]*mh]);
  const dc=[D.reduce((a,p)=>a+p[0],0)/n,D.reduce((a,p)=>a+p[1],0)/n],sc=[S.reduce((a,p)=>a+p[0],0)/n,S.reduce((a,p)=>a+p[1],0)/n];
  const srcs=[L.media];if(showGrid){gridImg=gridImg||gridCanvas();srcs.push(gridImg)}
  for(let i=0;i<n;i++){const j=(i+1)%n,dt=[dc,D[i],D[j]],st=[sc,S[i],S[j]],m=affNum(st,dt);if(!m)continue;
    // grow the clip a touch so neighbouring triangles meet without hairline gaps
    const gr=dt.map(p=>{const dx=p[0]-dc[0],dy=p[1]-dc[1],l=Math.hypot(dx,dy)||1;return[p[0]+dx/l*.8,p[1]+dy/l*.8]});
    srcs.forEach((im,k)=>{g.save();g.setTransform(dpr,0,0,dpr,0,0);g.beginPath();g.moveTo(...gr[0]);g.lineTo(...gr[1]);g.lineTo(...gr[2]);g.closePath();g.clip();
      g.transform(...m);g.globalAlpha=k?.75:1;try{g.drawImage(im,0,0,mw,mh)}catch(_){}g.restore()})}
}

/* ---------- draw ---------- */
function place(L){
  const s=L.el.style,w=L.w,h=L.h;
  if(L.type==='quad'||L.type==='circle'){
    s.width=w+'px';s.height=h+'px';s.transform=homography([[0,0],[w,0],[w,h],[0,h]],L.pts);
    s.clipPath=L.type==='circle'?'ellipse(50% 50% at 50% 50%)':'none';
  }else if(L.type==='tri'){
    s.width=w+'px';s.height=h+'px';s.transform=affine([[w/2,0],[w,h],[0,h]],L.pts);
    s.clipPath='polygon(50% 0,100% 100%,0 100%)';
  }else{
    s.width=W()+'px';s.height=H()+'px';s.transform='none';s.clipPath='none';drawFree(L);
  }
  s.opacity=L.opacity;
}
function render(){
  layers.forEach((L,i)=>{L.el.style.zIndex=i;place(L);
    L.el.querySelector('.gridov')?.remove();
    if(showGrid&&L.type!=='free'){const g=gridCanvas();g.className='gridov';g.style.opacity=.75;L.el.appendChild(g)}});
  let s='';
  layers.forEach((L,i)=>{const on=L===sel,c=on?'var(--sel)':'var(--accent)';
    const pts=L.pts.map(p=>p.join(',')).join(' ');
    s+=`<polygon points="${pts}" fill="#ffffff01" stroke="${c}" stroke-width="${on?2:1}" ${L.type==='circle'?'stroke-dasharray="6 6"':''} class="h" data-poly="${i}"/>`;
    if(on)L.pts.forEach((p,j)=>{const act=j===selPt;
      s+=`<circle class="h" data-pt="${j}" cx="${p[0]}" cy="${p[1]}" r="22" fill="#2fd3e033" stroke="${act?'var(--sel)':'var(--accent)'}" stroke-width="2"/><circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--accent)"/>`})});
  ov.innerHTML=s;
  document.getElementById('opa').value=sel?sel.opacity:1;
  document.getElementById('ptbtns').hidden=!(sel&&sel.type==='free');
  document.getElementById('grid').classList.toggle('on',showGrid);
  document.getElementById('nudge').hidden=!sel;
  document.getElementById('nlbl').textContent=selPt>=0?'Corner':'Shape';
  document.body.classList.toggle('locked',locked);
  const lb=document.getElementById('lock');lb.textContent=locked?'Unlock':'Lock';lb.classList.toggle('on',locked);
}

/* ---------- touch ---------- */
let drag=null;
ov.addEventListener('pointerdown',e=>{
  const t=e.target;
  if(t.dataset.pt!==undefined){const i=+t.dataset.pt;selPt=i;drag={type:'pt',i,ox:e.clientX-sel.pts[i][0],oy:e.clientY-sel.pts[i][1]}}
  else if(t.dataset.poly!==undefined){const L=layers[+t.dataset.poly];if(sel!==L){sel=L;selPt=-1;render();return}
    selPt=-1;drag={type:'all',x:e.clientX,y:e.clientY}}
  else return;
  ov.setPointerCapture(e.pointerId);e.preventDefault();render();
});
ov.addEventListener('pointermove',e=>{if(!drag||!sel)return;
  if(drag.type==='pt'){sel.pts[drag.i]=[e.clientX-drag.ox,e.clientY-drag.oy]}
  else{const dx=e.clientX-drag.x,dy=e.clientY-drag.y;sel.pts=sel.pts.map(p=>[p[0]+dx,p[1]+dy]);drag.x=e.clientX;drag.y=e.clientY}
  render()});
ov.addEventListener('pointerup',()=>{if(drag){drag=null;save()}});

/* ---------- media ---------- */
function attachMedia(L,blob){
  const url=URL.createObjectURL(blob);let m;
  if(blob.type.startsWith('video')){m=document.createElement('video');m.src=url;m.loop=true;m.muted=true;m.playsInline=true;m.autoplay=true;
    m.onloadedmetadata=()=>{setMediaSize(L,m.videoWidth,m.videoHeight);render();m.play().catch(()=>{})}}
  else{m=new Image();m.onload=()=>{setMediaSize(L,m.naturalWidth,m.naturalHeight);render()};m.src=url}
  L.media.replaceWith(m);L.media=m;
}
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!sel)addLayer('quad');
  attachMedia(sel,f);dbPut(sel.id,f);e.target.value=''};

/* ---------- buttons ---------- */
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{addLayer(b.dataset.add);render();save()});
document.getElementById('del').onclick=()=>{if(!sel)return;sel.el.remove();dbDel(sel.id);layers=layers.filter(l=>l!==sel);sel=layers.at(-1)||null;render();save()};
document.getElementById('up').onclick=()=>{if(!sel)return;layers=layers.filter(l=>l!==sel);layers.push(sel);render();save()};
document.getElementById('grid').onclick=()=>{showGrid=!showGrid;render()};
let clrArm=null;
document.getElementById('clr').onclick=e=>{const b=e.currentTarget;
  if(!clrArm){b.textContent='Tap again to clear';clrArm=setTimeout(()=>{clrArm=null;b.textContent='Clear all'},2500);return}
  clearTimeout(clrArm);clrArm=null;b.textContent='Clear all';
  layers.forEach(l=>{l.el.remove();dbDel(l.id)});layers=[];sel=null;render();save()};
document.getElementById('opa').oninput=e=>{if(sel){sel.opacity=+e.target.value;render();save()}};
document.getElementById('addpt').onclick=()=>{if(!sel||sel.type!=='free')return;const n=sel.pts.length,i=Math.max(0,selPt),j=(i+1)%n,
  mid=(A)=>[(A[i][0]+A[j][0])/2,(A[i][1]+A[j][1])/2];
  sel.pts.splice(i+1,0,mid(sel.pts));sel.src.splice(i+1,0,mid(sel.src));selPt=i+1;render();save()};
document.getElementById('delpt').onclick=()=>{if(!sel||sel.type!=='free'||sel.pts.length<=3)return;const i=Math.max(0,selPt);
  sel.pts.splice(i,1);sel.src.splice(i,1);selPt=Math.max(0,i-1);render();save()};

/* fine nudge: tap = 1px, hold = repeat and speed up */
let nudgeT=null,nudgeN=0;
function nudge(dx,dy){if(!sel||locked)return;const k=nudgeN>25?4:1;
  if(selPt>=0){sel.pts[selPt]=[sel.pts[selPt][0]+dx*k,sel.pts[selPt][1]+dy*k]}else sel.pts=sel.pts.map(p=>[p[0]+dx*k,p[1]+dy*k]);render()}
function stopNudge(){if(nudgeT){clearTimeout(nudgeT);nudgeT=null;save()}}
document.querySelectorAll('[data-n]').forEach(b=>{const [dx,dy]=b.dataset.n.split(',').map(Number);
  b.addEventListener('pointerdown',e=>{e.preventDefault();stopNudge();nudgeN=0;nudge(dx,dy);
    const rep=()=>{nudgeN++;nudge(dx,dy);nudgeT=setTimeout(rep,45)};nudgeT=setTimeout(rep,400)});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,stopNudge))});

/* lock */
document.getElementById('lock').onclick=()=>{locked=!locked;drag=null;try{localStorage.setItem('ppmLock',locked?'1':'')}catch(_){}render()};
document.getElementById('hide').onclick=()=>{document.body.classList.toggle('min');document.getElementById('hide').textContent=document.body.classList.contains('min')?'Show bar':'Hide bar'};

/* ---------- project mode ---------- */
let wake=null;
document.getElementById('go').onclick=async()=>{document.body.classList.add('proj');showGrid=false;render();
  if(!/; wv\)/.test(navigator.userAgent)){try{await document.documentElement.requestFullscreen()}catch(_){}}
  try{wake=await navigator.wakeLock.request('screen')}catch(_){}};
function exitProj(){if(!document.body.classList.contains('proj'))return false;
  hideExit();document.body.classList.remove('proj');document.body.classList.add('cool');
  setTimeout(()=>document.body.classList.remove('cool'),700);
  try{document.exitFullscreen()}catch(_){}try{wake&&wake.release()}catch(_){}render();return true}
window.exitProj=exitProj;
const exitBtn=document.getElementById('exit');let exitT=null;
function hideExit(){exitBtn.hidden=true;clearTimeout(exitT)}
stage.addEventListener('pointerdown',()=>{if(!document.body.classList.contains('proj'))return;
  exitBtn.hidden=false;clearTimeout(exitT);exitT=setTimeout(hideExit,3000)});
exitBtn.addEventListener('click',e=>{e.stopPropagation();hideExit();exitProj()});
stage.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- saving: layout in localStorage, images in IndexedDB ---------- */
let db=null;
function dbOpen(){return new Promise(r=>{try{const q=indexedDB.open('ppm',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(_){r()}})}
function dbPut(k,v){try{db&&db.transaction('m','readwrite').objectStore('m').put(v,k)}catch(_){}}
function dbDel(k){try{db&&db.transaction('m','readwrite').objectStore('m').delete(k)}catch(_){}}
function dbGet(k){return new Promise(r=>{try{const q=db.transaction('m').objectStore('m').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(_){r(null)}})}
function save(){try{localStorage.setItem('ppm2',JSON.stringify(layers.map(l=>({id:l.id,t:l.type,pts:l.pts,o:l.opacity,s:l.src}))))}catch(_){}}
async function load(){let d=null;try{d=JSON.parse(localStorage.getItem('ppm2')||'null')}catch(_){}
  if(!d||!d.length)return false;
  for(const x of d){const L=addLayer(x.t,x.pts,x.o,x.id,x.s);const b=db&&await dbGet(x.id);if(b)attachMedia(L,b)}
  render();return true}

addEventListener('resize',render);
try{locked=localStorage.getItem('ppmLock')==='1'}catch(_){}
(async()=>{await dbOpen();await load();sel=null;selPt=-1;render()})();
/* keep warped freeform videos moving */
(function tick(){layers.forEach(L=>{if(L.type==='free'&&L.media.tagName==='VIDEO')drawFree(L)});requestAnimationFrame(tick)})();
setTimeout(()=>document.getElementById('hint').hidden=true,8000);
</script>
</body></html>
